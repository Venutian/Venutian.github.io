<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta
    name="description"
    content="Fasten is a private fasting tracker for Ramadan, intermittent fasting, Orthodox fasting, Jewish fasts, and custom challenge fasts."
  />
  <title>Fasten</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #071820;
      color: #eef8fc;
    }
    main {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px;
      background:
        radial-gradient(circle at top, rgba(32, 192, 224, 0.16), transparent 38%),
        linear-gradient(180deg, #0b202a 0%, #071820 100%);
    }
    .card {
      width: min(760px, 100%);
      padding: 36px;
      border: 1px solid rgba(122, 186, 206, 0.2);
      border-radius: 24px;
      background: rgba(12, 36, 48, 0.82);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.25);
    }
    .eyebrow {
      display: inline-block;
      padding: 6px 12px;
      border-radius: 999px;
      background: rgba(32, 192, 224, 0.12);
      color: #50d4f0;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    h1 {
      margin: 18px 0 12px;
      font-size: clamp(42px, 7vw, 68px);
      line-height: 0.98;
      letter-spacing: -0.04em;
    }
    p {
      margin: 0 0 16px;
      color: #b8dce8;
      font-size: 18px;
      line-height: 1.6;
    }
    .actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 28px;
    }
    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 0 18px;
      border-radius: 999px;
      border: 1px solid rgba(32, 192, 224, 0.28);
      color: #eef8fc;
      text-decoration: none;
      font-weight: 700;
      background: rgba(20, 54, 72, 0.65);
    }
    .button.primary {
      background: #20c0e0;
      color: #071820;
      border-color: transparent;
    }
    .meta {
      margin-top: 24px;
      color: #7abace;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <main>
    <section class="card">
      <span class="eyebrow">nGen App</span>
      <h1>Fasten</h1>
      <p>
        A fasting tracker for Ramadan, intermittent fasting, Orthodox fasting,
        Jewish fasts, and custom challenge fasts.
      </p>
      <p>
        Fasten is designed to work privately on-device with no account and no
        cloud sync.
      </p>
      <div class="actions">
        <a class="button primary" href="/fasten/privacy.html">Privacy Policy</a>
        <a class="button" href="/">nGen</a>
      </div>
      <div class="meta">Published by nGen</div>
    </section>
  </main>
</body>
</html>
